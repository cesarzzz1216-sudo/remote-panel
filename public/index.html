<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RemotePanel</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--bg2:#161618;--bg3:#1e1e22;--bg4:#26262c;
  --border:#2a2a30;--text:#e0e0e4;--text-muted:#7a7a84;
  --accent:#7c5cff;--accent-hover:#6a48e8;
  --green:#22c55e;--red:#ef4444;--purple:#a78bfa;--gray:#6b7280;
  --radius:8px;
}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:13px}

.topbar{display:flex;align-items:center;gap:10px;padding:0 16px;height:42px;background:var(--bg2);border-bottom:1px solid var(--border)}
.topbar-logo{font-weight:700;font-size:15px;letter-spacing:.5px}
.topbar-logo span{color:var(--accent)}
.topbar-sep{width:1px;height:20px;background:var(--border)}
.ws-dot{width:8px;height:8px;border-radius:50%;background:var(--red);transition:background .3s}
.ws-dot.connected{background:var(--green)}
.topbar-info{font-size:12px;color:var(--text-muted)}

.layout{display:flex;height:calc(100vh - 42px - 24px);overflow:hidden}

.sidebar{width:240px;min-width:240px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-header{padding:12px 14px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);border-bottom:1px solid var(--border)}
.client-list{flex:1;overflow-y:auto;padding:6px}
.empty-msg{padding:20px 14px;text-align:center;color:var(--text-muted);font-size:12px}

.client-item{padding:10px 12px;border-radius:var(--radius);cursor:pointer;transition:background .15s;margin-bottom:2px}
.client-item:hover{background:var(--bg3)}
.client-item.active{background:var(--bg4);border:1px solid var(--border)}
.client-item .ci-name{font-weight:600;font-size:13px;margin-bottom:4px}
.client-item .ci-meta{display:flex;gap:6px;margin-bottom:3px}
.client-item .ci-sid{font-size:10px;color:var(--text-muted);font-family:monospace}

.badge{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.badge-green{background:rgba(34,197,94,.15);color:var(--green)}
.badge-gray{background:rgba(107,114,128,.15);color:var(--gray)}
.badge-purple{background:rgba(167,139,250,.15);color:var(--purple)}
.badge-red{background:rgba(239,68,68,.15);color:var(--red)}

@keyframes pulse-in{0%{opacity:0;transform:translateY(-4px)}100%{opacity:1;transform:translateY(0)}}
.client-item.pulse{animation:pulse-in .4s ease}

.main{flex:1;overflow-y:auto;padding:16px 20px;background:var(--bg)}

.no-select{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-muted);gap:12px}
.config-panel{display:none}
.config-panel.active{display:block}

.panel-topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.panel-title{font-size:16px;font-weight:700}
.panel-sep{flex:1}

.btn{padding:6px 14px;border:none;border-radius:var(--radius);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:var(--accent-hover)}
.btn-danger{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.25)}.btn-danger:hover{background:rgba(239,68,68,.25)}

.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none}
.section-header:hover{background:var(--bg3)}
.section-title{font-weight:600;font-size:13px}
.section-chevron{font-size:10px;color:var(--text-muted);transition:transform .2s}
.section.collapsed .section-body{display:none}
.section.collapsed .section-chevron{transform:rotate(-90deg)}
.section-body{display:flex;flex-wrap:wrap;padding:8px 14px 14px;gap:8px 16px}

.ctrl{display:flex;align-items:center;justify-content:space-between;min-width:180px;width:calc(50% - 8px)}
.ctrl.full{width:100%}
.ctrl-label{font-size:12px;color:var(--text-muted);white-space:nowrap}

.toggle{position:relative;display:inline-block;width:36px;height:20px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-track{position:absolute;inset:0;background:var(--bg4);border-radius:10px;transition:background .2s}
.toggle-track::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle input:checked+.toggle-track{background:var(--accent)}
.toggle input:checked+.toggle-track::after{transform:translateX(16px)}

.ctrl-slider{flex-direction:column;align-items:stretch;gap:4px}
.slider-wrap{display:flex;align-items:center;gap:8px}
.slider-wrap input[type=range]{flex:1;-webkit-appearance:none;height:4px;background:var(--bg4);border-radius:2px;outline:none}
.slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--accent);border-radius:50%;cursor:pointer}
.slider-val{font-size:11px;font-family:monospace;color:var(--accent);min-width:40px;text-align:right}

select{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;outline:none}
select:focus{border-color:var(--accent)}

.hex-input{background:var(--bg3);color:var(--accent);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;font-family:monospace;width:70px;text-align:center;outline:none;transition:border-color .2s}
.hex-input:focus{border-color:var(--accent)}

.statusbar{display:flex;align-items:center;gap:8px;padding:0 16px;height:24px;background:var(--bg2);border-top:1px solid var(--border);font-size:11px;color:var(--text-muted)}
.statusbar .sep{color:var(--border)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">Remote<span>Panel</span></div>
  <div class="topbar-sep"></div>
  <div class="ws-dot" id="wsDot"></div>
  <div class="topbar-info" id="wsStatus">Connecting&#x2026;</div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">DLL Clients</div>
    <div class="client-list" id="clientList">
      <div class="empty-msg" id="emptyMsg">No clients connected</div>
    </div>
  </div>

  <div class="main">
    <div class="no-select" id="noSelect">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
      </svg>
      <div>Select a client to configure</div>
    </div>

    <div class="config-panel" id="configPanel"></div>
  </div>
</div>

<div class="statusbar">
  <span id="sbClients">0 clients</span>
  <span class="sep">|</span>
  <span id="sbLastMsg">&#x2013;</span>
  <span class="sep">|</span>
  <span id="sbSelected">none selected</span>
</div>

<script>
const DEFAULTS = {
  aim_en: true,  aim_fov: 150, aim_smooth: 0.0, aim_dist: 200, aim_key: 0x45,
  aim_style: 1,  aim_hitbox: 0, aim_ignkn: true, aim_ignbt: false, aim_fovshow: false,
  fast_reload: true,
  sil_en: false, sil_fov: 100.0, sil_key: 0x01, sil_show: false,
  esp_en: true,  esp_box: true,  esp_skel: true, esp_hp: true, esp_name: true,
  esp_dist: true, esp_lines: false, esp_gun: false, esp_maxd: 500.0, esp_vis: false, radar: false,
  no_recoil: true, rapid: true, spin: false, spin_spd: 3.0, speedhack: true,
  fastmed: true, freecam: false,
  stream: true, dma_mode: false
};

const clients = new Map();
let selectedSid = null;
let lastMsgTime = null;

const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const wsUrl = `${proto}://${location.host}/panel`;
let ws = null;
let wsReconnTimer = null;

function connect() {
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    document.getElementById('wsDot').classList.add('connected');
    document.getElementById('wsStatus').textContent = 'Connected';
    clearTimeout(wsReconnTimer);
  };

  ws.onclose = () => {
    document.getElementById('wsDot').classList.remove('connected');
    document.getElementById('wsStatus').textContent = 'Reconnecting…';
    wsReconnTimer = setTimeout(connect, 3000);
  };

  ws.onerror = () => { ws.close(); };

  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch(e) { return; }
    handleMessage(msg);
    lastMsgTime = new Date();
    document.getElementById('sbLastMsg').textContent = 'Last msg: ' + lastMsgTime.toLocaleTimeString();
  };
}

function sendPanel(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function handleMessage(msg) {
  switch (msg.t) {
    case 'init':
      clients.clear();
      for (const c of msg.clients) clients.set(c.sid, Object.assign({ config: Object.assign({}, DEFAULTS) }, c));
      renderClientList();
      break;

    case 'client_connected':
      clients.set(msg.sid, {
        sid: msg.sid, username: msg.username, diag: 'ok', game: false,
        vma: 0, elf: 0, try: 0,
        connectedAt: msg.connectedAt || Date.now(), lastSeen: Date.now(),
        config: Object.assign({}, DEFAULTS, msg.config || {})
      });
      renderClientList(msg.sid);
      updateStatusBar();
      break;

    case 'client_disconnected':
      clients.delete(msg.sid);
      if (selectedSid === msg.sid) { selectedSid = null; showNoSelect(); }
      renderClientList();
      updateStatusBar();
      break;

    case 'status': {
      const c = clients.get(msg.sid);
      if (c) { c.game = msg.game; c.diag = msg.diag; c.vma = msg.vma; c.elf = msg.elf; c.try = msg.try; c.lastSeen = Date.now(); updateClientRow(msg.sid); }
      break;
    }

    case 'hb': {
      const c = clients.get(msg.sid);
      if (c) c.lastSeen = Date.now();
      break;
    }

    case 'state': {
      const c = clients.get(msg.sid);
      if (c && msg.d) { Object.assign(c.config, msg.d); if (selectedSid === msg.sid) refreshPanelValues(); }
      break;
    }

    case 'cfg_ack': {
      const c = clients.get(msg.sid);
      if (c && msg.config) { Object.assign(c.config, msg.config); if (selectedSid === msg.sid) refreshPanelValues(); }
      break;
    }
  }
}

function renderClientList(pulseId) {
  const list = document.getElementById('clientList');
  const empty = document.getElementById('emptyMsg');
  if (clients.size === 0) { list.innerHTML = ''; list.appendChild(empty); updateStatusBar(); return; }
  if (empty.parentNode === list) list.removeChild(empty);
  const existing = new Set();
  for (const [sid] of clients) existing.add(sid);
  for (const row of list.querySelectorAll('.client-item')) { if (!existing.has(row.dataset.sid)) list.removeChild(row); }
  for (const [sid, c] of clients) {
    let row = list.querySelector(`.client-item[data-sid="${CSS.escape(sid)}"]`);
    if (!row) { row = document.createElement('div'); row.className = 'client-item'; row.dataset.sid = sid; row.addEventListener('click', () => selectClient(sid)); list.appendChild(row); }
    if (selectedSid === sid) row.classList.add('active'); else row.classList.remove('active');
    if (pulseId === sid) { row.classList.add('pulse'); setTimeout(() => row.classList.remove('pulse'), 1200); }
    row.innerHTML = `<div class="ci-name">${esc(c.username)}</div><div class="ci-meta"><span class="badge ${c.game ? 'badge-green' : 'badge-gray'}">${c.game ? 'IN GAME' : 'IDLE'}</span><span class="badge ${c.diag === 'ok' ? 'badge-purple' : 'badge-red'}">${esc(c.diag)}</span></div><div class="ci-sid">${esc(sid)}</div>`;
  }
  updateStatusBar();
}

function updateClientRow(sid) {
  const row = document.getElementById('clientList').querySelector(`.client-item[data-sid="${CSS.escape(sid)}"]`);
  if (!row) return;
  const c = clients.get(sid);
  if (!c) return;
  row.innerHTML = `<div class="ci-name">${esc(c.username)}</div><div class="ci-meta"><span class="badge ${c.game ? 'badge-green' : 'badge-gray'}">${c.game ? 'IN GAME' : 'IDLE'}</span><span class="badge ${c.diag === 'ok' ? 'badge-purple' : 'badge-red'}">${esc(c.diag)}</span></div><div class="ci-sid">${esc(sid)}</div>`;
}

function updateStatusBar() {
  document.getElementById('sbClients').textContent = `${clients.size} client${clients.size !== 1 ? 's' : ''}`;
  if (selectedSid) { const c = clients.get(selectedSid); document.getElementById('sbSelected').textContent = c ? `Selected: ${c.username}` : 'none selected'; }
}

function selectClient(sid) { selectedSid = sid; renderClientList(); updateStatusBar(); buildConfigPanel(sid); }

function showNoSelect() { document.getElementById('noSelect').style.display = ''; document.getElementById('configPanel').classList.remove('active'); }

function buildConfigPanel(sid) {
  const c = clients.get(sid);
  if (!c) { showNoSelect(); return; }
  document.getElementById('noSelect').style.display = 'none';
  const panel = document.getElementById('configPanel');
  panel.classList.add('active');
  panel.dataset.sid = sid;
  panel.innerHTML = `
    <div class="panel-topbar"><div><div class="panel-title">${esc(c.username)}</div><div style="color:var(--text-muted);font-size:11px;margin-top:2px">${esc(sid)}</div></div><div class="panel-sep"></div><button class="btn btn-accent" onclick="sendCfg('${esc(sid)}',{force_reconnect:true})">⟳ Reconnect</button> <button class="btn btn-danger" onclick="doDisconnect('${esc(sid)}')">✕ Disconnect</button></div>
    ${buildSection('ESP','esp',[
      {type:'toggle',key:'esp_en',label:'ESP Enable'},{type:'toggle',key:'esp_box',label:'Box'},{type:'toggle',key:'esp_skel',label:'Skeleton'},{type:'toggle',key:'esp_hp',label:'Health Bar'},{type:'toggle',key:'esp_name',label:'Name'},{type:'toggle',key:'esp_dist',label:'Distance'},{type:'toggle',key:'esp_lines',label:'Lines'},{type:'toggle',key:'esp_gun',label:'Gun Name'},{type:'toggle',key:'esp_vis',label:'Visible Check'},{type:'toggle',key:'radar',label:'Radar Hack'},{type:'slider',key:'esp_maxd',label:'Max Distance',min:50,max:2000,step:10,float:true,full:true}
    ],c.config)}
    ${buildSection('AimBot','aim',[
      {type:'toggle',key:'aim_en',label:'Aim Enable'},{type:'toggle',key:'aim_ignkn',label:'Ignore Knocked'},{type:'toggle',key:'aim_ignbt',label:'Ignore Bots'},{type:'toggle',key:'aim_fovshow',label:'Show FOV'},{type:'toggle',key:'fast_reload',label:'Fast Reload'},{type:'select',key:'aim_style',label:'Style',full:true,options:[{v:0,l:'Mouse'},{v:1,l:'AimLock'},{v:2,l:'Total'}]},{type:'select',key:'aim_hitbox',label:'Hitbox',full:true,options:[{v:0,l:'Head'},{v:1,l:'Chest'},{v:2,l:'Neck'}]},{type:'slider',key:'aim_fov',label:'FOV',min:1,max:360,step:1,full:true},{type:'slider',key:'aim_smooth',label:'Smooth',min:0,max:10,step:0.1,float:true,full:true},{type:'slider',key:'aim_dist',label:'Max Distance',min:10,max:1000,step:10,full:true},{type:'hex',key:'aim_key',label:'Bind Key',full:true}
    ],c.config)}
    ${buildSection('Silent','sil',[
      {type:'toggle',key:'sil_en',label:'Silent Enable'},{type:'toggle',key:'sil_show',label:'Show FOV'},{type:'slider',key:'sil_fov',label:'FOV',min:1,max:360,step:1,float:true,full:true},{type:'hex',key:'sil_key',label:'Bind Key',full:true}
    ],c.config)}
    ${buildSection('Exploits','exp',[
      {type:'toggle',key:'no_recoil',label:'No Recoil'},{type:'toggle',key:'rapid',label:'Rapid Fire'},{type:'toggle',key:'spin',label:'SpinBot'},{type:'toggle',key:'speedhack',label:'Speed Hack'},{type:'toggle',key:'fastmed',label:'Fast Medkit'},{type:'toggle',key:'freecam',label:'Free Cam'},{type:'slider',key:'spin_spd',label:'Spin Speed',min:0.1,max:20,step:0.1,float:true,full:true}
    ],c.config)}
    ${buildSection('System','sys',[
      {type:'toggle',key:'stream',label:'Stream Mode'},{type:'toggle',key:'dma_mode',label:'DMA Mode'}
    ],c.config)}`;
  attachControlListeners(sid);
}

function buildSection(title, id, controls, cfg) {
  const rows = controls.map(ctrl => {
    const full = ctrl.full ? ' full' : '';
    if (ctrl.type === 'toggle') {
      return `<div class="ctrl${full}" data-key="${ctrl.key}"><span class="ctrl-label">${ctrl.label}</span><label class="toggle"><input type="checkbox" data-key="${ctrl.key}" ${cfg[ctrl.key]?'checked':''}><span class="toggle-track"></span></label></div>`;
    }
    if (ctrl.type === 'slider') {
      const val = cfg[ctrl.key] !== undefined ? cfg[ctrl.key] : 0;
      const disp = ctrl.float ? Number(val).toFixed(ctrl.step < 0.1 ? 2 : 1) : Math.round(val);
      return `<div class="ctrl ctrl-slider${full}" data-key="${ctrl.key}"><span class="ctrl-label">${ctrl.label}</span><div class="slider-wrap"><input type="range" data-key="${ctrl.key}" data-float="${ctrl.float||false}" min="${ctrl.min}" max="${ctrl.max}" step="${ctrl.step}" value="${val}"><span class="slider-val" id="sv_${ctrl.key}">${disp}</span></div></div>`;
    }
    if (ctrl.type === 'select') {
      const opts = ctrl.options.map(o => `<option value="${o.v}" ${cfg[ctrl.key]==o.v?'selected':''}>${o.l}</option>`).join('');
      return `<div class="ctrl${full}" data-key="${ctrl.key}"><span class="ctrl-label">${ctrl.label}</span><select data-key="${ctrl.key}">${opts}</select></div>`;
    }
    if (ctrl.type === 'hex') {
      const raw = cfg[ctrl.key] !== undefined ? cfg[ctrl.key] : 0;
      return `<div class="ctrl${full}" data-key="${ctrl.key}"><span class="ctrl-label">${ctrl.label}</span><input type="text" class="hex-input" data-key="${ctrl.key}" value="0x${Number(raw).toString(16).toUpperCase().padStart(2,'0')}" placeholder="0x00"></div>`;
    }
    return '';
  }).join('');
  return `<div class="section" id="sec_${id}"><div class="section-header" onclick="toggleSection('${id}')"><span class="section-title">${title}</span><span class="section-chevron">▼</span></div><div class="section-body">${rows}</div></div>`;
}

function toggleSection(id) { const sec = document.getElementById('sec_' + id); if (sec) sec.classList.toggle('collapsed'); }

function attachControlListeners(sid) {
  const panel = document.getElementById('configPanel');
  panel.querySelectorAll('input[type=checkbox]').forEach(el => { el.addEventListener('change', () => { sendCfg(sid, {[el.dataset.key]: el.checked}); }); });
  panel.querySelectorAll('input[type=range]').forEach(el => {
    el.addEventListener('input', () => {
      const isFloat = el.dataset.float === 'true';
      const val = isFloat ? parseFloat(el.value) : parseInt(el.value, 10);
      const sv = document.getElementById('sv_' + el.dataset.key);
      if (sv) { const step = parseFloat(el.step); sv.textContent = isFloat ? val.toFixed(step < 0.1 ? 2 : 1) : val; }
      sendCfg(sid, {[el.dataset.key]: val});
    });
  });
  panel.querySelectorAll('select').forEach(el => { el.addEventListener('change', () => { sendCfg(sid, {[el.dataset.key]: parseInt(el.value, 10)}); }); });
  panel.querySelectorAll('input.hex-input').forEach(el => {
    el.addEventListener('change', () => {
      const num = parseInt(el.value.trim(), 16);
      if (!isNaN(num)) { el.value = '0x' + num.toString(16).toUpperCase().padStart(2,'0'); sendCfg(sid, {[el.dataset.key]: num}); }
      else { el.style.borderColor = 'var(--red)'; setTimeout(() => el.style.borderColor = '', 1200); }
    });
  });
}

function refreshPanelValues() {
  const panel = document.getElementById('configPanel');
  const sid = panel.dataset.sid; if (!sid) return;
  const c = clients.get(sid); if (!c) return;
  const cfg = c.config;
  panel.querySelectorAll('input[type=checkbox]').forEach(el => { const k = el.dataset.key; if (k && cfg[k] !== undefined) el.checked = !!cfg[k]; });
  panel.querySelectorAll('input[type=range]').forEach(el => {
    const k = el.dataset.key;
    if (k && cfg[k] !== undefined) { el.value = cfg[k]; const sv = document.getElementById('sv_' + k); if (sv) { const isFloat = el.dataset.float === 'true'; const step = parseFloat(el.step); sv.textContent = isFloat ? parseFloat(cfg[k]).toFixed(step < 0.1 ? 2 : 1) : Math.round(cfg[k]); } }
  });
  panel.querySelectorAll('select').forEach(el => { const k = el.dataset.key; if (k && cfg[k] !== undefined) el.value = cfg[k]; });
  panel.querySelectorAll('input.hex-input').forEach(el => { const k = el.dataset.key; if (k && cfg[k] !== undefined) el.value = '0x' + Number(cfg[k]).toString(16).toUpperCase().padStart(2,'0'); });
}

function sendCfg(sid, updates) { const c = clients.get(sid); if (c) Object.assign(c.config, updates); sendPanel(Object.assign({t:'cfg',sid}, updates)); }
function doDisconnect(sid) { if (!confirm('Disconnect this client? The DLL will shut down.')) return; sendPanel({t:'disconnect',sid}); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

connect();
</script>
</body>
</html>
